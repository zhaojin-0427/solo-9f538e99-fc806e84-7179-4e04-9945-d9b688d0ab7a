services:
  pm25-api:
    build: .
    image: pm25-api:latest
    container_name: pm25-api
    ports:
      - "8000:8000"
    environment:
      PM25_DATA_DIR: /data
    volumes:
      # SQLite database, retained original CSVs and temp files all live here.
      - pm25-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  pm25-data:
    driver: local
